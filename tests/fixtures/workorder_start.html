<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Maximo workflow fixture</title>
<body><nav>
<a role="tab" href="#" onclick="render('anomaly');return false">Informes de anomalías</a>
<a role="tab" href="#" onclick="render('solutions');return false">Soluciones</a>
</nav><a id="toolactions_SAVE-tbb_anchor" href="#" onclick="saveRecord();return false">
<img id="toolactions_SAVE-tbb_image" alt="Guardar orden de trabajo" width="25" height="25" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="></a>
<div role="alert" id="saved-notice"></div><main id="form"></main><div id="dialogs"></div>
<div id="wait" style="display:none;position:fixed;inset:0;background:#ddd8">Cargando</div>
<aside id="warndiv" role="alert" aria-hidden="true" style="position:absolute;left:100%;top:0;width:0;height:100%">
<table id="warndiv_inner" style="display:none;position:fixed;left:10px;top:10px;width:400px;background:white;z-index:10000">
<tr><td id="warning-message">Mensaje del sistema: aviso anterior</td></tr>
<tr><td><button onclick="hideWarning()">Aceptar</button></td></tr></table></aside>
<div id="dijit_Dialog_0" role="dialog" style="display:none">Pegar desde Word</div>
<script>
let state, tab, generation = 0;
const save = () => sessionStorage.setItem('workflow-fixture', JSON.stringify(state));
function hideWarning() {
  document.getElementById('warndiv').setAttribute('aria-hidden','true');
  document.getElementById('warndiv_inner').style.display='none';
}
function showWarning(message) {
  document.getElementById('warning-message').textContent=message;
  document.getElementById('warndiv').setAttribute('aria-hidden','false');
  document.getElementById('warndiv_inner').style.display='table';
}
function resetState(overrides = {}) {
  hideWarning();
  state = {ot:'4314531',status:'APPR',faultclass:'OTHER',problem:'OLD-01',cause:'OLD-02',
    remedy:'OLD-03',events:[],routes:0,dirty:false,pendingDeletion:false,responses:0,...overrides};
  state.dirty = state.dirty || state.pendingDeletion;
  document.getElementById('saved-notice').textContent = '';
  tab = 'solutions'; save(); render(tab);
}
function asyncRender(action) {
  document.getElementById('wait').style.display = 'block';
  setTimeout(() => {
    action(); save(); render(tab);
    document.getElementById('wait').style.display = 'none';
  }, 100);
}
function control(caption, key, readonly = false) {
  const id = `mx${++generation}-tb`, image = id.replace('-tb', '-img');
  return `<p><label for="${id}">${caption}:</label>
    <input ctype="textbox" id="${id}" li="${image}" ${readonly?'readonly':''} value="${state[key]}">
    ${['faultclass','problem','cause','remedy'].includes(key)
      ? `<img id="${image}" alt="Seleccionar valor" width="20" height="20" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" onclick="lookup('${key}')">` : ''}</p>`;
}
function render(nextTab) {
  tab = nextTab;
  sessionStorage.setItem('workflow-fixture-tab', tab);
  document.getElementById('toolactions_SAVE-tbb_anchor').setAttribute('aria-disabled', state.dirty?'false':'true');
  document.getElementById('form').innerHTML = control('Orden de trabajo','ot',true)+control('Estado','status',true)+
    (tab === 'anomaly' ? control('Clase de anomalía','faultclass')+
      '<button id="mx_bg_button_listfailurecodes-pb" onclick="openFailureCodes()">Seleccionar códigos de anomalía</button>' :
      control('Síntoma','problem')+control('Causa','cause',true)+control('Resolucion','remedy',true))+
    '<img id="ROUTEWF_WO-MAIN_-tbb_image" alt="Enrutar flujo de trabajo" width="30" height="30" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" onclick="route()">';
  document.getElementById('dialogs').innerHTML = '';
}
function lookup(key, query = '') {
  state.events.push(['lookup',key]);
  let codes;
  if (key === 'faultclass') codes = query === '=RFN-70' ? ['RFN-70'] : ['OTHER'];
  else if (state.faultclass !== 'RFN-70') codes = [];
  else if (key === 'problem') codes = ['OTROS-01'];
  else if (key === 'cause') codes = state.problem === 'OTROS-01' ? ['OTROS-02'] : [];
  else codes = state.cause === 'OTROS-02' ? ['OTROS-05','OTROS-03'] : [];
  const prefix = 'lookup_page'+(++generation);
  document.getElementById('dialogs').innerHTML = `<section role="dialog" id="lookup_PROBLEMCODE-dialog_inner">
    Seleccionar valor
    <span mxevent="click" onclick="this.nextElementSibling.hidden=false">Filtro</span>
    <input hidden id="${prefix}_tfrow_[C:0]_txt-tb" onkeydown="if(event.key==='Enter')lookup('${key}',this.value)">
    ${codes.map((code,i)=>`<p><span id="${prefix}_tdrow_[C:0]_ttxt-lb[R:${i}]" mxevent="click"
      onclick="selectCode('${key}','${code}')">${code}</span></p>`).join('')}
    </section>`;
}
function selectCode(key, code) {
  if (key !== 'faultclass' && (state.pendingDeletion || state.forceHierarchyError)) {
    showWarning('Mensaje del sistema BMXAA4523E - El código de anomalía no se puede cambiar del estado de supresión porque es un nivel inferior de un código de anomalía marcado para supresión.');
    return;
  }
  state.events.push(['select',key,code]);
  asyncRender(() => {
    state.dirty = true;
    if (key === 'faultclass') {
      state.pendingDeletion = Boolean(state.problem || state.cause || state.remedy);
      state.problem = state.cause = state.remedy = '';
    } else if (key === 'problem') {
      state.pendingDeletion = Boolean(state.cause || state.remedy);
      state.cause = state.remedy = '';
    } else if (key === 'cause') {
      state.pendingDeletion = Boolean(state.remedy);
      state.remedy = '';
    }
    state[key] = code;
  });
}
const hierarchy = [
  {type:'PROBLEM',key:'problem',code:'OTROS-01'},
  {type:'CAUSE',key:'cause',code:'OTROS-02'},
  {type:'REMEDY',key:'remedy',code:'OTROS-03'}
];
function openFailureCodes() {
  state.events.push(['native-open']); save();
  showFailureCodes(state.nativeInitialStage || 0);
}
function showFailureCodes(index) {
  const level = hierarchy[index], prefix = 'mx'+(++generation);
  let codes = index === 2 ? ['OTROS-05','OTROS-03','OTROS-04'] : [level.code];
  if (state.nativeMissingCode === level.code) codes = codes.filter(code=>code!==level.code).concat('UNEXPECTED');
  const type = state.nativeWrongType || level.type;
  document.getElementById('dialogs').innerHTML = `<section role="dialog" id="wolistfailurecodes-dialog_inner">
    Seleccionar códigos de anomalía<table><tbody>
    ${codes.map((code,row)=>`<tr><td id="${prefix}_tdrow_[C:0]-c[R:${row}]"><span mxevent="click"
      id="${prefix}_tdrow_[C:0]_ttxt-lb[R:${row}]" onclick="selectFailureCode(${index},'${code}')">${code}</span></td>
      <td id="${prefix}_tdrow_[C:1]-c[R:${row}]"><span>${type}</span></td><td>Descripción</td></tr>`).join('')}
    </tbody></table>
    <button onclick="state.events.push(['unexpected-selector-button']);save()">Seleccionar</button>
    <button onclick="state.events.push(['unexpected-selector-button']);save()">Seleccionar y regresar</button>
    <button onclick="state.events.push(['unexpected-selector-button']);save()">Cerrar</button></section>`;
}
function selectFailureCode(index, code) {
  if (state.forceNativeError) {
    showWarning('BMXAA4523E - Error del selector nativo'); return;
  }
  document.getElementById('wait').style.display='block';
  setTimeout(() => {
    const level=hierarchy[index];
    state.events.push(['native-click',level.type,code],['select',level.key,code]);
    if (index===0) state.cause=state.remedy='';
    if (index===1) state.remedy='';
    state[level.key]=code; state.dirty=true; state.pendingDeletion=false;
    save(); render(tab);
    if (index<2 && !state.nativeCloseEarly) showFailureCodes(index+1);
    document.getElementById('wait').style.display='none';
  }, state.nativeDelayMs || 100);
}
function saveRecord() {
  if (!state.dirty) return;
  state.events.push(['save']);
  if (state.saveWarning && !state.saveWarningShown) {
    state.saveWarningShown = true;
    state.responses++; save();
    document.getElementById('dialogs').innerHTML = '<section role="dialog" id="alreadyreported-dialog_inner">El problema ya ha sido informado <button onclick="commitSave()">Continuar</button><button>Cancelar</button></section>';
  } else commitSave();
}
function commitSave() {
  asyncRender(() => {
    state.dirty = false; state.pendingDeletion = false; state.responses++;
    document.getElementById('saved-notice').textContent = 'BMXAA4205I - El registro ha sido guardado.';
  });
}
function route() {
  state.routes++; state.events.push(['route']); save();
  if (state.routes <= (state.noOpRoutes || 0)) return;
  if (state.routeDelayMs && !state.routeDelayed) {
    state.routeDelayed = true;
    document.getElementById('wait').style.display = 'block';
    setTimeout(() => {
      showRouteDialog(); save();
      document.getElementById('wait').style.display = 'none';
    }, state.routeDelayMs);
    return;
  }
  showRouteDialog();
}
function showRouteDialog() {
  if (state.unexpected) {
    document.getElementById('dialogs').innerHTML = '<section role="dialog" id="unknown-dialog_inner">Error inesperado <button onclick="state.events.push([\'unsafe-accept\']);save()">Aceptar</button></section>';
  } else if (state.routes === 1) {
    document.getElementById('dialogs').innerHTML = '<section role="dialog" id="alreadyreported-dialog_inner">El problema ya ha sido informado <button onclick="state.events.push([\'continue\']);save();render(tab)">Continuar</button><button>Cancelar</button></section>';
  } else {
    const radioMarkup = state.radioMarkup === 'aria' ?
      '<div><span id="label-cancel">Cancelar orden</span><input id="choice-cancel" name="choice" type="radio" checked aria-labelledby="label-cancel"></div><div><span id="label-start">Iniciar orden</span><input id="choice-start" name="choice" type="radio" aria-labelledby="label-start"></div>' :
      state.radioMarkup === 'container' ?
      '<div>Cancelar orden<input id="choice-cancel" name="choice" type="radio" checked></div><div>Iniciar orden<input id="choice-start" name="choice" type="radio"></div>' :
      '<label for="choice-cancel">Cancelar orden</label><input id="choice-cancel" name="choice" type="radio" checked><label for="choice-start">Iniciar orden</label><input id="choice-start" name="choice" type="radio">';
    document.getElementById('dialogs').innerHTML = `<section role="dialog" id="inputwf-dialog_inner">Entrada manual
      ${radioMarkup}
      <button onclick="confirmStart()">Aceptar</button><button>Cancelar</button></section>`;
  }
}
function confirmStart() {
  if (!document.getElementById('choice-start').checked) throw Error('Wrong workflow choice');
  asyncRender(() => { state.status='INPRG'; state.events.push(['start']); });
}
if (sessionStorage.getItem('workflow-fixture')) {
  state=JSON.parse(sessionStorage.getItem('workflow-fixture'));
  render(sessionStorage.getItem('workflow-fixture-tab') || 'solutions');
} else resetState();
</script></body></html>
